[package]
name = "schema-db"
version = "0.1.0"
edition = "2021"

[dependencies]
redb = "2.1.1"
rkyv = { version = "0.7.45", features = ["validation", "strict"] }
simd-json = "0.13.10"
compact_str = { version = "0.8.0", features = ["rkyv"] }
anyhow = "1.0.86"
bytecheck = "0.6.12"
reqwest = { version = "0.12.5", features = ["blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
